<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="Operator medals">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07141a"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a4a"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 4 medal panels -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- ORIGIN -->
    <g transform="translate(18,18)">
      <rect width="200" height="124" rx="10" fill="url(#panel)" stroke="#13353a" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="3" fill="url(#edge)" opacity="0.85"/>
      <circle cx="100" cy="48" r="22" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#g)"/>
      <circle cx="100" cy="48" r="8" fill="#00f0ff" opacity="0.85">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="100" y="90" text-anchor="middle" font-size="12" fill="#00f0ff" letter-spacing="2">ORIGIN</text>
      <text x="100" y="110" text-anchor="middle" font-size="13" fill="#b7e0d6">NODE · 2022</text>
    </g>

    <!-- FORGE -->
    <g transform="translate(238,18)">
      <rect width="200" height="124" rx="10" fill="url(#panel)" stroke="#13353a" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="3" fill="url(#edge)" opacity="0.85"/>
      <circle cx="100" cy="48" r="22" fill="none" stroke="#39ff14" stroke-width="2" filter="url(#g)"/>
      <path d="M88 54 L100 32 L112 54 Z" fill="none" stroke="#39ff14" stroke-width="2"/>
      <text x="100" y="90" text-anchor="middle" font-size="12" fill="#39ff14" letter-spacing="2">FORGE</text>
      <text x="100" y="110" text-anchor="middle" font-size="13" fill="#b7e0d6">12 PUBLIC REPOS</text>
    </g>

    <!-- SENTINEL -->
    <g transform="translate(458,18)">
      <rect width="200" height="124" rx="10" fill="url(#panel)" stroke="#13353a" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="3" fill="url(#edge)" opacity="0.85"/>
      <circle cx="100" cy="48" r="22" fill="none" stroke="#ff2a4a" stroke-width="2" filter="url(#g)"/>
      <path d="M100 32 L112 48 L100 64 L88 48 Z" fill="none" stroke="#ff2a4a" stroke-width="2"/>
      <text x="100" y="90" text-anchor="middle" font-size="12" fill="#ff2a4a" letter-spacing="1.5">SENTINEL</text>
      <text x="100" y="110" text-anchor="middle" font-size="13" fill="#b7e0d6">ETHICAL PT MODE</text>
    </g>

    <!-- SIGNAL -->
    <g transform="translate(678,18)">
      <rect width="200" height="124" rx="10" fill="url(#panel)" stroke="#13353a" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="3" fill="url(#edge)" opacity="0.85"/>
      <circle cx="100" cy="48" r="22" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#g)"/>
      <rect x="90" y="38" width="6" height="20" fill="#39ff14" opacity="0.9">
        <animate attributeName="height" values="10;20;10" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="48;38;48" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="100" y="42" width="6" height="16" fill="#00f0ff" opacity="0.9">
        <animate attributeName="height" values="8;16;8" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="50;42;50" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="110" y="46" width="6" height="12" fill="#ff2a4a" opacity="0.9">
        <animate attributeName="height" values="6;14;6" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="52;44;52" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="90" text-anchor="middle" font-size="12" fill="#00f0ff" letter-spacing="2">SIGNAL</text>
      <text x="100" y="110" text-anchor="middle" font-size="13" fill="#b7e0d6">STATUS · HIREABLE</text>
    </g>
  </g>
</svg>
