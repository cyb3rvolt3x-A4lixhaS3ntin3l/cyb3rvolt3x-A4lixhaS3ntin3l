<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="cyb3rvolt3x Sentinel profile banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070a"/>
      <stop offset="45%" stop-color="#07141a"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a4a"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8fff8"/>
      <stop offset="55%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#vignette)"/>

  <!-- orbit rings -->
  <g transform="translate(980,180)" opacity="0.85" filter="url(#glow)">
    <circle r="96" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle r="72" fill="none" stroke="#39ff14" stroke-opacity="0.2" stroke-width="1"/>
    <circle r="48" fill="none" stroke="#ff2a4a" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M-10 -4 L0 -14 L10 -4 L6 10 L-6 10 Z" fill="none" stroke="#39ff14" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- tactical brackets -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M30 30 H90 V50"/>
    <path d="M30 330 H90 V310"/>
    <path d="M1170 30 H1110 V50"/>
    <path d="M1170 330 H1110 V310"/>
  </g>

  <!-- scan beam -->
  <rect x="0" width="1200" height="40" fill="url(#scan)" opacity="0.9">
    <animate attributeName="y" values="-40;360;-40" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- accent baseline -->
  <rect x="60" y="286" width="720" height="2" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- status chip -->
  <g transform="translate(60,52)">
    <rect width="210" height="28" rx="4" fill="#0a1a16" stroke="#39ff14" stroke-opacity="0.55"/>
    <circle cx="16" cy="14" r="5" fill="#39ff14">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#39ff14" letter-spacing="1.5">SYS // ONLINE 2026</text>
  </g>

  <text x="60" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7a9a96" letter-spacing="6">CYB3RVOLT3X / A4LIXHA S3NTIN3L</text>
  <text x="60" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">Syed zada abrar</text>
  <text x="62" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#b7e0d6" letter-spacing="2.5">FULL-STACK BUILDER  ·  CERTIFIED PENTESTER  ·  PLATFORM ARCHITECT</text>

  <!-- floating nodes -->
  <g fill="#00f0ff">
    <circle cx="760" cy="80" r="2.5">
      <animate attributeName="cy" values="80;95;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="300" r="2" fill="#39ff14">
      <animate attributeName="cy" values="300;285;300" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="60" r="1.5" fill="#ff2a4a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
