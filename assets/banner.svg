<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="cyb3rvolt3x Sentinel profile banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070a"/>
      <stop offset="48%" stop-color="#07141a"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a4a"/>
      <stop offset="42%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8fff8"/>
      <stop offset="52%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#00f0ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="42%" cy="48%" r="72%">
      <stop offset="40%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#vignette)"/>

  <!-- orbit rings -->
  <g transform="translate(980,180)" opacity="0.9" filter="url(#glow)">
    <circle r="98" fill="none" stroke="#00f0ff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle r="74" fill="none" stroke="#39ff14" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="50" fill="none" stroke="#ff2a4a" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="8 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M-11 -5 L0 -16 L11 -5 L7 11 L-7 11 Z" fill="none" stroke="#39ff14" stroke-width="1.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- tactical brackets -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.72">
    <path d="M30 30 H95 V52"/>
    <path d="M30 330 H95 V308"/>
    <path d="M1170 30 H1105 V52"/>
    <path d="M1170 330 H1105 V308"/>
  </g>

  <!-- scan beam -->
  <rect x="0" width="1200" height="36" fill="url(#scan)" opacity="0.95">
    <animate attributeName="y" values="-40;360;-40" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- accent baseline -->
  <rect x="60" y="288" width="700" height="2" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- status chip -->
  <g transform="translate(60,50)">
    <rect width="228" height="28" rx="4" fill="#0a1a16" stroke="#39ff14" stroke-opacity="0.55"/>
    <circle cx="16" cy="14" r="5" fill="#39ff14">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#39ff14" letter-spacing="1.6">SYS // ONLINE 2026</text>
  </g>

  <text x="60" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7a9a96" letter-spacing="5.5">CYB3RVOLT3X / A4LIXHA S3NTIN3L</text>
  <text x="60" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="50" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">Syed zada abrar</text>
  <text x="62" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b7e0d6" letter-spacing="2.2">FULL-STACK BUILDER  ·  CERTIFIED PENTESTER  ·  PLATFORM ARCHITECT</text>

  <g fill="#00f0ff">
    <circle cx="760" cy="80" r="2.5">
      <animate attributeName="cy" values="80;96;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="300" r="2" fill="#39ff14">
      <animate attributeName="cy" values="300;284;300" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="62" r="1.6" fill="#ff2a4a">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
