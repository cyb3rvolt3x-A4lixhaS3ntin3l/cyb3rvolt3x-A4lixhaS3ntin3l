    </filter>
  </defs>
  <rect width="1100" height="48" fill="transparent"/>
  <path d="M20 24 H480 L500 12 L520 36 L540 24 H1080" fill="none" stroke="url(#line)" stroke-width="2" filter="url(#g)">
