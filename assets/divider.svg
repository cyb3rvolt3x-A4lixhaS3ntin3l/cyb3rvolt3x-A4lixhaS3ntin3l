<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="48" viewBox="0 0 1100 48" role="img" aria-label="neon divider">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a4a" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ff2a4a"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="82%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
