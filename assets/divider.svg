  <circle cx="520" cy="24" r="4" fill="#00f0ff" filter="url(#g)">
    <animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="550" y="42" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#5c857d" letter-spacing="3">// SIGNAL LOCKED</text>
