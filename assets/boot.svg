      <tspan>boot --identity cyb3rvolt3x</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="28" y="86" fill="#7aa8a0" opacity="0">
      <tspan>[OK] full-stack runtime mounted</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    </text>
    <text x="28" y="110" fill="#7aa8a0" opacity="0">
      <tspan>[OK] pentest kit / ethical channel active</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
    </text>
    <text x="28" y="134" fill="#7aa8a0" opacity="0">
      <tspan>[OK] platform forge · private R&amp;D online</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2s" fill="freeze"/>
